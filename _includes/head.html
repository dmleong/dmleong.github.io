<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width initial-scale=1">

	<title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
	<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
	<meta property="og:site_name" content="Danielle Leong"/>
	<meta property="og:title" content="Engineering leader and hands-on technical operator"/>
	<meta property="og:description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">
	<meta property="og:type" content="blog"/>

	<link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">
	<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
	<link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />
	<link href='https://fonts.googleapis.com/css?family=Open+Sans:300italic,400,300' rel='stylesheet' type='text/css'>

	<!-- Google Analytics 4 -->
	<script async src="https://www.googletagmanager.com/gtag/js?id=G-VH79VCR1GR"></script>
	<script>
		window.dataLayer = window.dataLayer || [];
		function gtag(){dataLayer.push(arguments);}
		gtag('js', new Date());
		gtag('config', 'G-VH79VCR1GR');
	</script>

	<style>
		.home #hero {
			background: url("../img/github-universe.jpg") no-repeat center center;
			height: 600px;
			-webkit-background-size: cover;
			-moz-background-size: cover;
			-o-background-size: cover;
			background-size: cover;
			margin-top: -60px;
			padding-top: 60px; }
		.home #hero h1 {
			margin-bottom: 0; }

		.hero-content {
			width: 50%;
			margin-top: 16%;
			color: white; }

			.trigger li {
				list-style-type: none;
				display: inline;
				margin: 0 15px;
			}

		@media screen and (max-width: 600px) {
			.home #hero {
				height: 400px;
				margin-top: -120px;
				background: url("../img/header-mobile.jpg") no-repeat left left; }
			.home #hero h1 {
				margin-bottom: 10px;
				font-size: 14px;
				font-size: 1.4rem; }
			.home #hero p {
				font-size: 10px;
				font-size: 1rem; }

			.hero-content {
				margin-top: 28%;
				width: 95%; }

			.footer-col-2 li {
				display: inline-block;
				padding-right: 50px; } }
		.site-header.full {
			border-bottom: 1px solid transparent; }


	</style>
</head>
